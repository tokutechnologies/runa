name: Build content

on:
  push:
    paths:
      - "content/**.md"
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Generate posts index
        run: python3 generate_content.py

      - name: Fetch Instagram
        run: |
          python3 fetch_instagram.py \
            --behold "${{ secrets.BEHOLD_FEED_URL }}" \
            --download

      - name: Commit generated files
        run: |
          git config user.name "content-bot"
          git config user.email "actions@users.noreply.github.com"

          git add content/posts.json
          git add content/instagram.json
          git add assets/ig

          git diff --cached --quiet || git commit -m "chore: update generated content"
          git push